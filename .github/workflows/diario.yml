name: Atividade diária

# 5 commits por dia, em minutos "quebrados" (o GitHub atrasa mais os agendamentos
# na hora cheia) e todos bem antes das 21:00 de Brasília, que é a meia-noite UTC
# usada pelo gráfico de contribuições. Assim, mesmo com atraso, nada cai no dia seguinte.
on:
  schedule:
    - cron: "17 11 * * *"  # 08:17 (Brasília) - turno 1
    - cron: "43 13 * * *"  # 10:43 (Brasília) - turno 2
    - cron: "29 15 * * *"  # 12:29 (Brasília) - turno 3
    - cron: "51 17 * * *"  # 14:51 (Brasília) - turno 4
    - cron: "37 19 * * *"  # 16:37 (Brasília) - turno 5
    - cron: "23 21 * * *"  # 18:23 (Brasília) - reserva: completa os turnos que faltaram
  workflow_dispatch:
    inputs:
      turno:
        description: "Turno (1 a 5). Em branco completa todos os que faltam hoje."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: atividade-diaria
  cancel-in-progress: false

jobs:
  registrar:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Registrar atividade
        env:
          GIT_NAME: ${{ secrets.GIT_NAME }}
          GIT_EMAIL: ${{ secrets.GIT_EMAIL }}
          AGENDA: ${{ github.event.schedule }}
          TURNO_MANUAL: ${{ inputs.turno }}
        run: |
          if [ -z "$GIT_NAME" ] || [ -z "$GIT_EMAIL" ]; then
            echo "Defina os secrets GIT_NAME e GIT_EMAIL no repositório."
            exit 1
          fi

          case "$AGENDA" in
            "17 11 * * *") TURNOS="1" ;;
            "43 13 * * *") TURNOS="2" ;;
            "29 15 * * *") TURNOS="3" ;;
            "51 17 * * *") TURNOS="4" ;;
            "37 19 * * *") TURNOS="5" ;;
            *)
              if [ -n "$TURNO_MANUAL" ]; then TURNOS="$TURNO_MANUAL"; else TURNOS="1 2 3 4 5"; fi
              ;;
          esac

          # O gráfico do GitHub usa o dia em UTC: depois das 21:00 de Brasília já é amanhã.
          export TZ=UTC
          HOJE=$(date +%Y-%m-%d)
          ARQUIVO=.github/atividade.txt
          git config user.name "$GIT_NAME"
          git config user.email "$GIT_EMAIL"
          git pull --rebase --quiet origin main

          NOVOS=0
          for N in $TURNOS; do
            if grep -q "^$HOJE turno-$N " "$ARQUIVO" 2>/dev/null; then
              echo "Turno $N de $HOJE já registrado."
              continue
            fi
            echo "$HOJE turno-$N $(TZ=America/Sao_Paulo date +%H:%M) (Brasília)" >> "$ARQUIVO"
            tail -n 300 "$ARQUIVO" > "$ARQUIVO.tmp" && mv "$ARQUIVO.tmp" "$ARQUIVO"
            git add "$ARQUIVO"
            git commit -m "Atividade de $(date +%d/%m/%Y) (turno $N de 5)"
            NOVOS=$((NOVOS + 1))
          done

          if [ "$NOVOS" -eq 0 ]; then
            echo "Nada novo para enviar."
            exit 0
          fi

          for tentativa in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "$NOVOS commit(s) enviado(s)."
              exit 0
            fi
            sleep $((tentativa * 20))
            git pull --rebase origin main
          done
          echo "Não foi possível enviar os commits depois de 5 tentativas."
          exit 1
